<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>🚀 Add Sigma Book 🚀</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Comic Sans MS, cursive;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
                    linear-gradient(
                            45deg,
                            #ff00ff,
                            #00ffff,
                            #ffff00,
                            #00ff00,
                            #ff0000
                    );

            background-size:400% 400%;
            animation:gradientMove 6s infinite alternate;
            overflow:hidden;
        }

        @keyframes gradientMove{
            from{
                background-position:left;
            }
            to{
                background-position:right;
            }
        }

        .floating{
            position:fixed;
            font-size:50px;
            animation:floatUp 10s linear infinite;
            opacity:0.7;
        }

        @keyframes floatUp{
            from{
                transform:translateY(100vh) rotate(0deg);
            }
            to{
                transform:translateY(-150px) rotate(720deg);
            }
        }

        .container{
            width:700px;
            padding:40px;

            background:rgba(255,255,255,0.2);
            backdrop-filter:blur(15px);

            border:6px dashed lime;
            border-radius:30px;

            box-shadow:
                    0 0 20px hotpink,
                    0 0 50px cyan,
                    0 0 100px yellow;
        }

        h1{
            text-align:center;
            margin-bottom:30px;

            font-size:3rem;
            color:white;

            text-shadow:
                    0 0 10px hotpink,
                    0 0 20px cyan,
                    0 0 30px yellow;

            animation:shake 2s infinite alternate;
        }

        @keyframes shake{
            from{
                transform:rotate(-2deg);
            }
            to{
                transform:rotate(2deg);
            }
        }

        .field{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-size:1.3rem;
            font-weight:bold;
            color:white;
            text-shadow:0 0 10px black;
        }

        input[type="text"]{
            width:100%;
            padding:15px;

            border:none;
            border-radius:15px;

            font-size:1.1rem;

            background:white;

            box-shadow:
                    0 0 10px cyan,
                    0 0 20px hotpink;
        }

        input[type="text"]:focus{
            outline:none;

            box-shadow:
                    0 0 20px yellow,
                    0 0 40px lime;
        }

        .checkbox-wrapper{
            display:flex;
            align-items:center;
            gap:15px;

            margin-top:20px;
            margin-bottom:30px;
        }

        input[type="checkbox"]{
            width:30px;
            height:30px;
            cursor:pointer;
        }

        .submit-btn{
            width:100%;
            padding:20px;

            border:none;
            border-radius:20px;

            font-size:1.5rem;
            font-weight:bold;

            cursor:pointer;

            background:
                    linear-gradient(
                            90deg,
                            hotpink,
                            yellow,
                            cyan
                    );

            animation:bounce 1s infinite alternate;

            box-shadow:
                    0 0 20px hotpink,
                    0 0 40px cyan;
        }

        @keyframes bounce{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(-8px);
            }
        }

        .submit-btn:hover{
            transform:scale(1.05);
        }

    </style>

</head>
<body>

<div class="floating" style="left:5%">💀</div>
<div class="floating" style="left:20%; animation-delay:2s;">🔥</div>
<div class="floating" style="left:35%; animation-delay:4s;">🗿</div>
<div class="floating" style="left:50%; animation-delay:1s;">🚀</div>
<div class="floating" style="left:65%; animation-delay:3s;">⚡</div>
<div class="floating" style="left:80%; animation-delay:5s;">💯</div>

<div class="container">

    <h1>
        📚 SUMMON NEW SIGMA BOOK 📚
    </h1>

    <form th:action="@{/books/add}"
          th:object="${book}"
          method="post">

        <div class="field">
            <label>📖 Book Lore Title</label>
            <input type="text" th:field="*{title}"
                   placeholder="Enter legendary sigma title">
        </div>

        <div class="field">
            <label>🧠 Author Aura Owner</label>
            <input type="text" th:field="*{author}"
                   placeholder="Who cooked this masterpiece?">
        </div>

        <div class="field">
            <label>🎭 Ohio Genre Classification</label>
            <input type="text" th:field="*{genre}"
                   placeholder="Fantasy, Horror, Brainrot...">
        </div>

        <div class="field">
            <label>💸 Aura Price</label>
            <input type="text" th:field="*{price}"
                   placeholder="How many aura points?">
        </div>

        <div class="checkbox-wrapper">
            <input type="checkbox" th:field="*{available}">
            <label>🟢 Currently Farming W Rizz Stock</label>
        </div>

        <button class="submit-btn" type="submit">
            🚀 DEPLOY TO OHIO DATABASE 🚀
        </button>

    </form>

</div>

</body>
</html>
