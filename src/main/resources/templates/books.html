<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📚 Skibidi Bookstore Deluxe 📚</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Comic Sans MS, cursive;
        }

        body{
            min-height:100vh;
            background:
                    linear-gradient(
                            45deg,
                            #ff00ff,
                            #00ffff,
                            #ffff00,
                            #ff0000,
                            #00ff00
                    );
            background-size:400% 400%;
            animation:bgMove 5s infinite alternate;
            overflow-x:hidden;
        }

        @keyframes bgMove{
            0%{background-position:left;}
            100%{background-position:right;}
        }

        h1{
            text-align:center;
            font-size:4rem;
            color:white;
            text-shadow:
                    0 0 10px hotpink,
                    0 0 20px cyan,
                    0 0 40px yellow;
            margin-top:20px;
            animation:spinText 3s infinite alternate;
        }

        @keyframes spinText{
            from{transform:rotate(-2deg);}
            to{transform:rotate(2deg);}
        }

        .brainrot-container{
            width:95%;
            margin:auto;
            margin-top:30px;
            background:rgba(255,255,255,0.2);
            backdrop-filter:blur(15px);
            border:6px dashed lime;
            padding:20px;
            border-radius:30px;
            box-shadow:
                    0 0 25px hotpink,
                    0 0 50px cyan,
                    0 0 100px yellow;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:black;
            color:lime;
            font-size:1.4rem;
            padding:15px;
            text-transform:uppercase;
            animation:rainbow 2s infinite;
        }

        @keyframes rainbow{
            0%{color:red;}
            20%{color:orange;}
            40%{color:yellow;}
            60%{color:lime;}
            80%{color:cyan;}
            100%{color:magenta;}
        }

        td{
            padding:15px;
            text-align:center;
            font-weight:bold;
            font-size:1.1rem;
            border:3px solid black;
        }

        tr:nth-child(even){
            background:#ffe6ff;
        }

        tr:nth-child(odd){
            background:#ccffff;
        }

        tr:hover{
            transform:scale(1.02);
            background:yellow;
            transition:0.2s;
        }

        .edit-btn{
            background:lime;
            color:black;
            text-decoration:none;
            padding:10px 18px;
            border-radius:999px;
            font-weight:bold;
            box-shadow:0 0 15px lime;
        }

        .edit-btn:hover{
            background:black;
            color:lime;
        }

        .delete-btn{
            background:red;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:999px;
            font-weight:bold;
            box-shadow:0 0 15px red;
        }

        .delete-btn:hover{
            background:black;
            color:red;
        }

        .add-btn{
            display:block;
            width:350px;
            text-align:center;
            margin:30px auto;
            padding:20px;
            text-decoration:none;
            font-size:1.5rem;
            font-weight:bold;
            background:
                    linear-gradient(
                            90deg,
                            hotpink,
                            yellow,
                            cyan
                    );
            color:black;
            border-radius:20px;
            box-shadow:
                    0 0 20px hotpink,
                    0 0 40px cyan;
            animation:bounce 1s infinite alternate;
        }

        @keyframes bounce{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(-10px);
            }
        }

        .status-yes{
            color:limegreen;
            font-size:1.3rem;
        }

        .status-no{
            color:red;
            font-size:1.3rem;
        }

        .floating-skull{
            position:fixed;
            font-size:50px;
            animation:float 8s linear infinite;
            opacity:0.7;
        }

        @keyframes float{
            from{
                transform:translateY(100vh) rotate(0deg);
            }
            to{
                transform:translateY(-100px) rotate(720deg);
            }
        }

    </style>
</head>
<body>

<div class="floating-skull" style="left:5%">💀</div>
<div class="floating-skull" style="left:25%; animation-delay:2s;">🔥</div>
<div class="floating-skull" style="left:50%; animation-delay:4s;">🗿</div>
<div class="floating-skull" style="left:75%; animation-delay:1s;">⚡</div>
<div class="floating-skull" style="left:90%; animation-delay:3s;">🚀</div>

<h1>
    📚 SIGMA SKIBIDI OHIO BOOKSTORE 📚
</h1>

<div class="brainrot-container">

    <table>

        <tr>
            <th>📖 Title</th>
            <th>🧠 Author</th>
            <th>🎭 Genre</th>
            <th>💸 Price</th>
            <th>📦 Stock</th>
            <th>🛠️ Edit</th>
            <th>☠️ Delete</th>
        </tr>

        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.genre}"></td>
            <td th:text="'$' + ${book.price}"></td>

            <td>
            <span
                    th:class="${book.available} ? 'status-yes' : 'status-no'"
                    th:text="${book.available} ? '🟢 W RIZZ STOCK' : '🔴 L AURA OUT OF STOCK'">
            </span>
            </td>

            <td>
                <a class="edit-btn"
                   th:href="@{/books/update/{id}(id=${book.id})}">
                    ✨ COOK
                </a>
            </td>

            <td>
                <a class="delete-btn"
                   th:href="@{/books/delete/{id}(id=${book.id})}">
                    💀 YEET
                </a>
            </td>

        </tr>

    </table>

</div>

<a class="add-btn" th:href="@{/books/add}">
    🚀 ADD NEW SIGMA BOOK 🚀
</a>

</body>
</html>
